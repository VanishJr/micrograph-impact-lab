[project]
name = "micrograph-impact-lab"
version = "0.1.0"
description = "A research loop on optical micrographs, built at the Claude Impact Lab Berlin 2026"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10",
    "pyyaml>=6",
    "scikit-image>=0.22",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
